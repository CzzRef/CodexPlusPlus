<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex++ 统一模型 · 离线交互预览</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#233730;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--codex-plus-text:#233730;--codex-plus-border:#dce3df;--codex-plus-surface:#fff}header{padding:24px max(24px,calc((100vw - 1000px)/2));border-bottom:1px solid #dce3df;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}header b{font-size:17px}header span{font-size:11px;color:#697a72;border:1px solid #dce3df;padding:6px 9px;border-radius:6px}main{max-width:1000px;margin:26px auto;padding:0 24px}nav{display:flex;gap:24px;font-size:13px;margin:0 0 24px;border-bottom:1px solid #dce3df;color:#829087}nav b{color:#2b705a;border-bottom:2px solid;padding:0 0 14px}nav span{padding:0 0 14px}footer{font-size:11px;color:#6b7c74;padding:22px 0;line-height:1.8}@media(prefers-color-scheme:dark){body{background:#17201c;color:#e1eae5;--codex-plus-text:#e1eae5;--codex-plus-border:#34463c;--codex-plus-surface:#202d26}header{background:#202d26;border-color:#34463c}}
</style></head><body><header><b>Codex++</b><span>离线预览 · 使用模拟状态</span></header><main><nav><span>常规</span><span>供应商</span><b>统一模型</b><span>用户脚本</span></nav><div id="panel"></div><footer>此页面加载实际注入页面组件，连接使用模拟数据。它用于验证布局与交互，不会修改 Codex 配置、登录账号或发出模型请求。</footer></main>
<script src="../../assets/inject/unified-panel.js"></script><script>
  const levels=[{effort:'low'},{effort:'medium'},{effort:'high'}];
  const runtime={status:'ok',routingMode:'unified',enabled:true,gatewayPid:123,browserPid:456,tunnelOwnerPid:789,health:{status:'ok'},settings:{bunPath:'/managed/gateway/runtime/bun',runtimeEntry:'/managed/gateway/app/cli.js',electronPath:'/managed/electron/Electron.app/Contents/MacOS/Electron',browserEntry:'/managed/browser/electron/main.cjs',groupDefaults:{}}};
  const catalog={models:[{slug:'gpt-5.6-sol',display_name:'官方 · GPT-5.6 Sol',supported_reasoning_levels:levels},{slug:'cpp/acme/gpt-5.6-sol',display_name:'工作 API · GPT-5.6 Sol',supported_reasoning_levels:levels,cpp_route:{kind:'api',profileId:'acme'}},{slug:'cpp-agg/team/gpt-5.6-sol',display_name:'研发模型组 · GPT-5.6 Sol',supported_reasoning_levels:levels,cpp_route:{kind:'aggregate',groupId:'team'}},{slug:'chatgpt-web/sol/high',display_name:'ChatGPT Web · Sol High',supported_reasoning_levels:[{effort:'high'}]}],profiles:[{id:'acme',name:'工作 API'},{id:'backup',name:'备用 API'}],groups:[{id:'team',name:'研发模型组',strategy:'requestRoundRobin',defaultProfileId:'acme',members:[{relayId:'acme',weight:1},{relayId:'backup',weight:1}]}],preferences:{},turns:[{threadId:'preview-thread',turnId:'turn-1',model:'cpp-agg/team/gpt-5.6-sol',profileId:'acme'}]};
  window.__codexPlusUnifiedPanel.mount(document.querySelector('#panel'),{threadId:()=>new URLSearchParams(location.search).has('draft')?'':'preview-thread',currentModel:()=> 'cpp-agg/team/gpt-5.6-sol',postJson:async(path,body)=>{
    if(path==='/unified/choices')return{status:'ok',data:catalog};
    if(path==='/unified/control'){const pref=catalog.preferences[body.threadId]??={efforts:{},groups:{}};if('reasoningEffort'in body)pref.efforts[body.model]=body.reasoningEffort;if(body.groupId)pref.groups[body.groupId]={profileId:body.profileId,selectionMode:body.selectionMode};return{status:'ok'};}
    if(body.action==='disable'){runtime.enabled=false;runtime.routingMode='legacy';runtime.health=null;runtime.browserPid=null;runtime.tunnelOwnerPid=null;}
    if(body.action==='enable'){runtime.enabled=true;runtime.routingMode='unified';runtime.health={status:'ok'};runtime.browserPid=456;runtime.tunnelOwnerPid=789;}
    if(body.action==='set-group-default'){catalog.groups.find(group=>group.id===body.groupId).defaultProfileId=body.profileId;return{status:'ok'};}
    if(body.action==='save-components')runtime.settings=body.settings;
    if(body.action==='configure-web')return{status:'configured',connectorName:body.settings.browserInteractionMode==='manual'?'Codex Zero Risk':'Codex Native2'};
    return structuredClone(runtime);
  }});
</script></body></html>
